[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taes-atcoder-vs-llm"
version = "0.1.0"
description = "Pipeline para comparar soluções humanas do AtCoder com soluções geradas por LLM."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "beautifulsoup4",
    "langchain-google-genai",
    "langchain-nvidia-ai-endpoints",
    "langchain-openai",
    "langgraph",
    "pandas",
    "playwright",
    "python-dotenv",
    "requests",
]

[project.scripts]
taes-loop = "taes.loop.cli:main"
taes-pipeline = "taes.cli.pipeline:main"
taes-qodana = "taes.analysis.qodana:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["taes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
